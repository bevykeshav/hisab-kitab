<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mera Hisab Kitab">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>Mera Hisab Kitab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1{margin:0}.muted{color:#6b7280;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:14px}.num{font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:14px}
input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #d1d5db;font:inherit}
button{background:#111827;color:#fff;border:0;font-weight:700;cursor:pointer}.item{padding:12px 0;border-bottom:1px solid #eee}
.ok{color:#166534}.err{color:#b91c1c}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Mera Hisab Kitab</h1><p class="muted">Google Sheets connected</p>
<div class="stats">
<div class="stat">Received<div class="num" id="received">₹0</div></div>
<div class="stat">Paid<div class="num" id="paid">₹0</div></div>
<div class="stat">Net<div class="num" id="net">₹0</div></div>
</div>
<div class="card">
<h2>Add Transaction</h2>
<form id="form">
<div class="grid">
<label>Date<input id="date" type="date" required></label>
<label>Amount<input id="amount" type="number" min="0" step="0.01" required></label>
<label>Owner / Whose money?<input id="person" value="You" required></label>
<label>Type<select id="type"><option value="income">Income / Received</option><option value="expense">Expense / Paid</option><option value="transfer">Transfer</option></select></label>
<label>Category<input id="category" value="Other"></label>
<label>Account<select id="account"><option>Bank</option><option>Cash</option><option>UPI</option></select></label>
</div>
<p><label>Note<textarea id="note" rows="3"></textarea></label></p>
<button type="submit">Save Transaction</button>
<p id="status" class="muted"></p>
</form>
</div>
<div class="card">
<h2>Transactions</h2><button type="button" onclick="load()">Refresh</button>
<div id="list"></div>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbyGjhpK51mHhgBKonDNer-T_RGci0v_69JYJgPp42XCViOpbd7G1QZp0tlK20erV2AS/exec";
let data=[];
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 const r=data.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.amount||0),0);
 const p=data.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.amount||0),0);
 $("received").textContent=money(r);$("paid").textContent=money(p);$("net").textContent=money(r-p);
 $("list").innerHTML=data.slice().reverse().map(x=>`<div class="item"><b>${esc(x.person||"You")}</b> — ${money(x.amount)}<br><span class="muted">${esc(x.date||"")} · ${esc(x.category||"")} · ${esc(x.type||"")}</span><br>${esc(x.note||"")}</div>`).join("")||'<p class="muted">No transactions yet.</p>';
}
function api(action,params={}){
 return new Promise((resolve,reject)=>{
  const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const s=document.createElement("script");
  window[cb]=o=>{delete window[cb];s.remove();o?.success===false?reject(new Error(o.error||"API error")):resolve(o)};
  s.src=API+"?"+new URLSearchParams({action,callback:cb,...params});
  s.onerror=()=>{delete window[cb];s.remove();reject(new Error("Google Sheets connection failed"))};
  document.body.appendChild(s);
 });
}
async function load(){
 $("status").textContent="Loading…";
 try{const o=await api("get");data=o.transactions||[];render();$("status").textContent="Connected to Google Sheets";$("status").className="ok"}
 catch(e){$("status").textContent=e.message;$("status").className="err"}
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();$("status").textContent="Saving…";
 try{
  await api("add",{date:$("date").value,amount:$("amount").value,person:$("person").value,account:$("account").value,type:$("type").value,category:$("category").value,note:$("note").value});
  e.target.reset();$("date").value=new Date().toISOString().slice(0,10);$("person").value="You";$("category").value="Other";$("account").value="Bank";$("type").value="income";
  await load();
 }catch(err){$("status").textContent=err.message;$("status").className="err"}
});
$("date").value=new Date().toISOString().slice(0,10);
load();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
